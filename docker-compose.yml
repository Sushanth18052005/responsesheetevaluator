version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_CDN_DOMAINS=cdn3.digialm.com,cdn.digialm.com,digialm.com
      - REQUEST_TIMEOUT=30
      - MAX_RESPONSE_SIZE=10485760
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
